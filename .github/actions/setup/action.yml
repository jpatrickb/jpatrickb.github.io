name: Set up toolchain
description: Node, pnpm and optionally Terraform, pinned to the same versions as the Patea repos.

inputs:
  node-version:
    description: Node version. Patea repos are on 24.
    default: "24"
  terraform:
    description: Install Terraform ("true" or "false").
    default: "false"
  terraform-version:
    description: Terraform version constraint.
    default: ~1.15.0
  install:
    description: Run pnpm install with a frozen lockfile ("true" or "false").
    default: "true"

runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json's packageManager field.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # Only cache when installing: without an install there is no store to save.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - if: inputs.terraform == 'true'
      uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # Astro keeps its encoded images in node_modules/.astro. Without this every build, and CI runs three per change,
    # re-encodes every photo from scratch. The key changes when the photos or the config do, and the restore key
    # lets a build that adds photos start from the previous cache and encode only the new ones.
    - if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules/.astro
        key: astro-images-${{ runner.os }}-${{ hashFiles('src/assets/photos/**', 'astro.config.mjs') }}
        restore-keys: |
          astro-images-${{ runner.os }}-
