name: Terraform plan

# Shows what a pull request would change in Cloudflare, as a comment on the PR. Applying happens
# in deploy.yml after the merge, never here.
#
# This workflow uses READ-ONLY credentials (CLOUDFLARE_PLAN_TOKEN and the R2_PLAN_* keys). They are
# repo secrets, so any workflow on a branch of this repo can read them, which is why they must
# not be able to change anything. Pull requests from forks get no secrets and are skipped.

on:
  pull_request:
    paths:
      - infra/**
      - scripts/terraform.sh
      - .github/workflows/terraform-plan.yml

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          terraform: "true"
          install: "false"

      - name: Plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PLAN_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_PLAN_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_PLAN_SECRET_ACCESS_KEY }}
          TF_ENV: ${{ matrix.env }}
        run: |
          set -o pipefail
          scripts/terraform.sh plan "$TF_ENV" 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      # The comment is public, and masking only covers the log, so redact the identifiers by hand.
      - name: Comment the plan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TF_ENV: ${{ matrix.env }}
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          marker="<!-- terraform-plan-$TF_ENV -->"
          {
            echo "$marker"
            echo "### Terraform plan: \`$TF_ENV\`"
            echo
            echo '```'
            if [ -s "$RUNNER_TEMP/plan.txt" ]; then
              # drop the ::add-mask:: workflow commands that scripts/terraform.sh printed
              text="$(head -c 60000 "$RUNNER_TEMP/plan.txt" | sed '/^::add-mask::/d')"
              for pair in "$ACCOUNT_ID=<account-id>" "$ZONE_ID=<zone-id>" "$BUCKET=<state-bucket>"; do
                value="${pair%%=*}"
                [ -z "$value" ] || text="${text//"$value"/${pair#*=}}"
              done
              printf '%s\n' "$text"
            else
              echo "The plan produced no output. See the workflow run."
            fi
            echo '```'
          } >"$RUNNER_TEMP/comment.md"

          id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi
